# ============================================================
# proposal-narration / voices.yaml
# ------------------------------------------------------------
# 配音聲音清單。Step 1 確認對話時，讀取此檔列出所有選項。
# 使用者可自由新增/刪除/排序此檔，不需動 skill.md。
#
# 多 Provider 支援：
#   provider: elevenlabs | openai | edge_tts
#   cost:     paid | free
#
# 欄位說明：
#   key            短代號（A/B/C... 給對話選單用）
#   name           中文顯示名
#   provider       服務商（決定走哪個 API）
#   cost           paid（付費，要算錢）/ free（免費）
#   voice_id       對應 provider 的 voice id（ElevenLabs 用 hash / OpenAI 用 nova / Edge 用 zh-TW-XXXNeural）
#   gender         male / female
#   description    一句話形容
#   model          provider 對應 model（ElevenLabs eleven_v3 / OpenAI tts-1-hd / Edge 不需要）
#   settings       voice_settings dict（僅 ElevenLabs 用）
#   user_validated true 表示林秉澄試聽後評價可接受
#   notes          備註（適用情境、提醒事項、付費注意）
# ============================================================

voices:

