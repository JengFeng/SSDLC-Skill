# ============================================================
# Provider 比較表（給用戶選擇時參考）
# ============================================================
provider_comparison:
  elevenlabs:
    cost: 💰 訂閱制（Starter $6/月含 30k credits）
    chinese: ⭐⭐⭐⭐⭐ 最佳，台灣腔
    expressive: ⭐⭐⭐⭐⭐ 起伏最豐富（v3 模型）
    can_clone: ✅ 可 clone 個人聲音
    best_for: 政府提案、商用配音、要 clone 自己聲音

  edge_tts:
    cost: 🆓 完全免費
    chinese: ⭐⭐⭐⭐⭐ 100% 準確（Azure Neural 同引擎）
    expressive: ⭐⭐⭐ 中等
    can_clone: ❌ 不能
    best_for: 測試、demo、零預算、英中混合

  openai:
    cost: 💰 按字計費 (~$0.030/1k chars，17 頁約 $0.10)
    chinese: ⭐⭐⭐ 略帶洋腔
    expressive: ⭐⭐⭐⭐ 起伏豐富
    can_clone: ❌ 不能
    best_for: 英中混合內容、不在意輕微洋腔、要英文流暢

# ============================================================
# 預設策略（用戶完全沒指定 + 沒說「隨便」時）
# ============================================================
defaults:
  voice_key: B          # Tiffy_TW（仍要問用戶確認）
  duration_min: 10       # 10 分鐘標準版
  preserve_pptx: true    # 不動 PPTX 視覺，只配音

# ============================================================
# 仍不建議的選擇（已驗證效果差）
# ============================================================
not_recommended:
  - id: eleven_multilingual_v2
    reason: 比 v3 太念稿、無起伏，已被 v3 取代
  - id: eleven_turbo_v2_5 / eleven_flash_v2_5
    reason: 速度型模型，提案級不適用
  - id: "ElevenLabs stab < 0.30"
    reason: 走音
  - id: "ElevenLabs stab=1.0 + style=1.0"
    reason: 機械化過頭

