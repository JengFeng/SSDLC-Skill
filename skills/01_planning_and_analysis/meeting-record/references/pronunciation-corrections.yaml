# ============================================================
# 校正 SOP
# ============================================================
sop:
  - "1. 第一輪：用本表自動校正（context 為空的全替換）"
  - "2. 第二輪：context 限定的看上下文決定是否替換"
  - "3. 第三輪：人名類務必跟使用者確認（避免改錯）"
  - "4. 同音字記在備註，給後續同系列會議參考"
