# Phase 05 部署現況盤點；不得部署或讀取機密值。
inputs:
  - name: source_code_dir
    description: 舊專案根目錄（唯讀）
    required: true
  - name: deployment_configs
    description: 偵測 Docker/Kubernetes/IIS/雲端等部署檔（若有）
    required: false
  - name: dependency_manifests
    description: 依賴/建置 manifest（若有）
    required: false
outputs:
  - name: deploy_files_manifest.json
    description: 部署與建置檔清單及路徑
    required: true
  - name: docker_analysis.md
    description: 存在 Dockerfile 時的靜態分析；否則略過
    required: false
  - name: deployment_topology.md
    description: 從配置證據整理的拓撲及未知項
    required: true
  - name: build_manifest.json
    description: 建置步驟/依賴的觀察或推論摘要，不執行建置
    required: true
  - name: deployment_report.md
    description: 部署現況、證據、敏感值遮蔽與限制
    required: true
