# Phase 06 維運現況盤點；不得連線至正式環境或輸出機密值。
inputs:
  - name: source_code_dir
    description: 舊專案根目錄（唯讀）
    required: true
  - name: operations_configs
    description: 日誌/監控/告警/排程設定（若有）
    required: false
  - name: existing_docs
    description: README、INSTALL、runbook 等既有文件（若有）
    required: false
outputs:
  - name: ops_files_manifest.json
    description: 維運相關檔案清單及路徑
    required: true
  - name: logging_analysis.md
    description: 存在日誌設定時的靜態分析
    required: false
  - name: monitoring_analysis.md
    description: 存在監控設定時的靜態分析
    required: false
  - name: ops_runbook.md
    description: 僅記錄有證據支持的操作；未知步驟標為待確認
    required: true
  - name: ops_restoration_report.md
    description: 維運現況、缺口、證據及限制
    required: true
