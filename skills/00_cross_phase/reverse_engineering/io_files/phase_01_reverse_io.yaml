# Phase 01 逆向模式 IO；產物在人工確認前皆為候選基線。
inputs:
  - name: er_diagram.md
    description: Phase 02 資料模型
    required: true
  - name: api_spec.md
    description: Phase 02 API 盤點/候選規格
    required: true
  - name: system_architecture.md
    description: Phase 02 架構描述
    required: true
  - name: use_case_diagram.md
    description: Phase 02 使用案例圖（若有）
    required: false
  - name: use_case_list.json
    description: Phase 02 使用案例清單（若有）
    required: false
  - name: code_analysis.md
    description: Phase 03 證據摘要
    required: true
outputs:
  - name: formal_requirements.md
    description: 有追溯證據的候選功能/非功能需求
    required: true
  - name: executable_spec.yaml
    description: SSOT 候選規格，明確標示 reverse_engineered 與 approval 狀態
    required: true
  - name: requirements.feature
    description: 可追溯到證據的候選 Gherkin 場景
    required: true
  - name: system_specification.md
    description: 系統規格候選稿，區分事實與假設
    required: true
  - name: traceability_matrix.md
    description: 候選需求到設計/程式證據的雙向追溯矩陣
    required: true
  - name: reverse_engineering_report.md
    description: 還原範圍、信心、限制、缺口與人工審核摘要
    required: true
  - name: reverse_completion_summary.json
    description: 階段狀態與待審核資訊；不得預先宣告已核准
    required: true
