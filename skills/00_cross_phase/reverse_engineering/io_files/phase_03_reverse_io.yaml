# Phase 03 逆向模式 IO 契約
# 路徑皆相對於使用者指定的專案根目錄。
phase: "03"
mode: reverse_engineering
path_base: project_root
inputs:
  - id: "project_dir"
    path: "."
    required: true
    description: "指定案例根目錄；可包含原始碼、成品、紀錄或文件。無原始碼另須來源 manifest。"
  - id: "reverse_input_manifest.json"
    path: "inputs/reverse_input_manifest.json"
    required: false
    description: "無原始碼模式必要：來源、source_available=false、操作範圍與指紋；檢查器另行驗證。"
  - id: "db_ddl_file"
    path: "inputs/db_schema.sql"
    required: false
    description: "資料庫 DDL（若有）"
outputs:
  - id: "scan_report.json"
    path: "outputs/phase_03_reverse/scan_report.json"
    required: true
    description: "專案掃描概覽"
  - id: "module_list.json"
    path: "outputs/phase_03_reverse/module_list.json"
    required: true
    description: "模組清單（檔名、路徑、職責描述）"
  - id: "class_function_list.json"
    path: "outputs/phase_03_reverse/class_function_list.json"
    required: true
    description: "類別與函數清單"
  - id: "api_routes.json"
    path: "outputs/phase_03_reverse/api_routes.json"
    required: true
    description: "API 路由清單"
  - id: "db_schema_raw.sql"
    path: "outputs/phase_03_reverse/db_schema_raw.sql"
    required: false
    description: "有證據時的反推 DB Schema"
  - id: "table_list.json"
    path: "outputs/phase_03_reverse/table_list.json"
    required: true
    description: "資料表清單"
  - id: "dependency_list.json"
    path: "outputs/phase_03_reverse/dependency_list.json"
    required: true
    description: "第三方依賴清單"
  - id: "code_analysis.md"
    path: "outputs/phase_03_reverse/code_analysis.md"
    required: true
    description: "程式碼分析報告"

# language_hint 為對話／執行參數，不是檔案，不列入檔案 IO 契約。

  - id: "evidence_manifest.json"
    path: "outputs/phase_03_reverse/evidence_manifest.json"
    required: false
    description: "無原始碼模式必要，由 check_no_source_evidence.py 條件式驗證。"

  - id: "findings_index.json"
    path: "outputs/phase_03_reverse/findings_index.json"
    required: false
    description: "無原始碼模式必要，由 check_no_source_evidence.py 條件式驗證。"

  - id: "unknowns.json"
    path: "outputs/phase_03_reverse/unknowns.json"
    required: false
    description: "無原始碼模式必要，由 check_no_source_evidence.py 條件式驗證。"

  - id: "coverage.json"
    path: "outputs/phase_03_reverse/coverage.json"
    required: false
    description: "無原始碼模式必要，由 check_no_source_evidence.py 條件式驗證。"
