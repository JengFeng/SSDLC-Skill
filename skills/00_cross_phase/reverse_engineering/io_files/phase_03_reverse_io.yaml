# Phase 03 逆向模式 IO 契約
# 路徑皆相對於使用者指定的專案根目錄。
phase: "03"
mode: reverse_engineering
path_base: project_root
inputs:
  - id: "source_code_dir"
    path: "."
    required: true
    description: "指定專案根目錄與來源檔案"
  - id: "db_ddl_file"
    path: "inputs/db_schema.sql"
    required: false
    description: "資料庫 DDL（若有）"
outputs:
  - id: "scan_report.json"
    path: "outputs/phase_03_reverse/scan_report.json"
    required: true
    description: "專案掃描概覽"
  - id: "module_list.json"
    path: "outputs/phase_03_reverse/module_list.json"
    required: true
    description: "模組清單（檔名、路徑、職責描述）"
  - id: "class_function_list.json"
    path: "outputs/phase_03_reverse/class_function_list.json"
    required: true
    description: "類別與函數清單"
  - id: "api_routes.json"
    path: "outputs/phase_03_reverse/api_routes.json"
    required: true
    description: "API 路由清單"
  - id: "db_schema_raw.sql"
    path: "outputs/phase_03_reverse/db_schema_raw.sql"
    required: false
    description: "有證據時的反推 DB Schema"
  - id: "table_list.json"
    path: "outputs/phase_03_reverse/table_list.json"
    required: true
    description: "資料表清單"
  - id: "dependency_list.json"
    path: "outputs/phase_03_reverse/dependency_list.json"
    required: true
    description: "第三方依賴清單"
  - id: "code_analysis.md"
    path: "outputs/phase_03_reverse/code_analysis.md"
    required: true
    description: "程式碼分析報告"

# language_hint 為對話／執行參數，不是檔案，不列入檔案 IO 契約。
