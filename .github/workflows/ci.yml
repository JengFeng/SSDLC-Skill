name: SSDLC CI - Spec Integrity Check

on:
  push:
    branches: [main, develop, "feature/**", "codex/**"]
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  spec-integrity:
    name: Spec Integrity Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Spec Integrity (Mode A - SSOT)
        run: python scripts/check_spec_integrity.py --mode A
        continue-on-error: true

      - name: Run Spec Integrity (Mode D - Full Scan)
        run: python scripts/check_spec_integrity.py --mode D
        continue-on-error: true

      - name: Run Framework Alignment
        shell: pwsh
        run: ./scripts/align_framework.ps1
        continue-on-error: true

      - name: Run README Sync Check
        shell: pwsh
        run: ./scripts/check-readme-sync.ps1
        continue-on-error: true
