<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><title>員工管理 UI 雛型</title>

<body class="p-4 bg-light"><div class="container"><h2>員工基本資料管理系統 — UI 雛型</h2>
<div class="card mb-3"><div class="card-body">
<div class="d-flex justify-content-between mb-3"><input class="form-control w-25" placeholder="搜尋..."><button class="btn btn-primary">搜尋</button><button class="btn btn-success">+ 新增</button></div>
<table class="table"><thead class="table-primary"><tr><th>#</th><th>姓名</th><th>部門</th><th>職稱</th><th>Email</th><th>到職日</th><th></th></tr></thead>
<tbody><tr><td>1</td><td>王小明</td><td>研發部</td><td>工程師</td><td>w@ex.com</td><td>2025-01-15</td><td><button class="btn btn-sm btn-outline-primary">編輯</button> <button class="btn btn-sm btn-outline-danger">刪除</button></td></tr></tbody></table></div></div>
<div class="card" style="max-width:500px"><div class="card-body"><h5>新增員工</h5>
<div class="mb-2"><label>姓名</label><input class="form-control"></div>
<div class="mb-2"><label>部門</label><input class="form-control"></div>
<div class="mb-2"><label>職稱</label><input class="form-control"></div>
<div class="mb-2"><label>Email</label><input type="email" class="form-control"></div>
<div class="mb-2"><label>到職日</label><input type="date" class="form-control"></div>
