    ui_prototype: "02_system_design/outputs/ui_prototype.html"
    use_case_diagram: "02_system_design/outputs/use_case_diagram.md"
    activity_diagram: "02_system_design/outputs/activity_diagram.md"
    sequence_diagram: "02_system_design/outputs/sequence_diagram.md"
  database:
    tables: [employees, departments, employee_history, employee_education, employee_experience, employee_certification, audit_log]
  api:
    endpoints: ["GET /employees", "GET /employees/:id", "POST /employees", "PUT /employees/:id", "PATCH /employees/:id", "DELETE /employees/:id", "GET /employees/:id/history", "POST /employees/:id/history", "GET /employees/:id/education", "POST /employees/:id/education", "GET /employees/:id/experience", "POST /employees/:id/experience", "GET /employees/:id/certifications", "POST /employees/:id/certifications", "GET /me", "PATCH /me", "GET /reports/*", "GET /export/*", "GET /departments", "POST /departments", "GET /audit-logs"]
  evaluator:
    passed: true
    scores: { completeness: 95, consistency: 95, traceability: 95 }
    errors: { type_a: [], type_b: [] }

