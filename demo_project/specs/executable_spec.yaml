# =============================================================================
# 可執行規格母版 — 員工基本資料管理系統 (Demo Project)
# =============================================================================
project:
  name: "員工基本資料管理系統"
  version: "1.0.0"
  created: "2026-06-27"
  last_updated: "2026-06-27"
  current_phase: "completed"
  description: "輕量級 Web CRUD 應用，Python Flask + SQLite + Jinja2，提供員工基本資料新增/刪除/修改/查詢"

# =============================================================================
# 階段 01：規劃與需求分析 ✅ completed
# =============================================================================
phase_01_planning:
  status: completed
  baseline: "baseline/phase-01_v1/"
  inputs:
    raw_requirements:
      - "01_planning_and_analysis/inputs/user_requirement_raw.md"
    rfp_documents: []
  outputs:
    formal_requirements: "01_planning_and_analysis/outputs/formal_requirements.md"
    requirement_tracker: "01_planning_and_analysis/reg/requirement_tracker.md"
  requirements:
    - id: "REQ_001"
      description: "員工列表與關鍵字搜尋（姓名/部門/Email 模糊比對）"
      priority: P0
      source: "01_planning_and_analysis/inputs/user_requirement_raw.md"
      acceptance_criteria:
        - "首頁顯示所有員工表格列表"
        - "搜尋框可依姓名、部門、Email 模糊比對"
        - "無員工時顯示提示訊息"
    - id: "REQ_002"
      description: "新增員工（五項必填欄位 + Email 唯一性檢查）"
      priority: P0
      source: "01_planning_and_analysis/inputs/user_requirement_raw.md"
      acceptance_criteria:
        - "表單含姓名、部門、職稱、Email、到職日五欄位"
        - "所有欄位必填，空白提交顯示錯誤"
        - "Email 重複時拒絕並顯示提示"
        - "成功後 redirect 回首頁"
    - id: "REQ_003"
      description: "修改員工資料"
      priority: P0
      source: "01_planning_and_analysis/inputs/user_requirement_raw.md"
      acceptance_criteria:
        - "可編輯既有員工所有欄位"
        - "保留 Email 不變時可通過唯一性檢查"
    - id: "REQ_004"
      description: "刪除員工（確認對話框）"
      priority: P0
      source: "01_planning_and_analysis/inputs/user_requirement_raw.md"
      acceptance_criteria:
        - "點選刪除彈出瀏覽器確認對話框"
        - "確認後物理刪除資料"
    - id: "REQ_005"
      description: "Email 唯一性約束"
      priority: P0
      source: "01_planning_and_analysis/reg/grill_me_session.md"
      acceptance_criteria:
        - "資料庫層級 UNIQUE 約束"
        - "重複 Email 觸發 IntegrityError"
    - id: "REQ_006"
      description: "ER 模型設計"
      priority: P1
      source: "設計規範"
      acceptance_criteria:
        - "employees 表含 id/name/department/title/email/hire_date/created_at/updated_at"
    - id: "REQ_007"
      description: "UI 雛型設計"
      priority: P1
      source: "設計規範"
      acceptance_criteria:
        - "互動式 HTML 雛型（Bootstrap）"
        - "含列表頁、表單頁兩畫面"
    - id: "REQ_008"
      description: "使用案例設計"
      priority: P1
      source: "設計規範"
      acceptance_criteria:
        - "人資管理員 × 5 用例（列表/新增/修改/刪除/搜尋）"
    - id: "REQ_009"
      description: "業務流程設計"
      priority: P1
      source: "設計規範"
      acceptance_criteria:
        - "CRUD 完整業務流程活動圖"
    - id: "REQ_010"
      description: "互動時序設計"
      priority: P1
      source: "設計規範"
      acceptance_criteria:
        - "新增員工 MVC 三層互動時序圖"
  evaluator:
    passed: true
    scores:
      coverage: 40
      clarity: 30
      traceability: 20
      format: 10
    errors:
      type_a: []
      type_b: []

# =============================================================================
# 階段 02：系統設計 ✅ completed
# =============================================================================
phase_02_design:
  status: completed
  baseline: "baseline/phase-02_v1/"
  inputs:
    requirements:
      - "01_planning_and_analysis/outputs/formal_requirements.md"
  outputs:
    db_schema: "02_system_design/outputs/db_schema.sql"
    er_diagram: "02_system_design/outputs/er_diagram.md"
    api_spec: "02_system_design/outputs/api_spec.md"
    ui_prototype: "02_system_design/outputs/ui_prototype.html"
    use_case_diagram: "02_system_design/outputs/use_case_diagram.md"
    activity_diagram: "02_system_design/outputs/activity_diagram.md"
    sequence_diagram: "02_system_design/outputs/sequence_diagram.md"
  database:
    tables:
      - name: "employees"
        columns:
          - {name: "id", type: "INTEGER", constraints: "PRIMARY KEY AUTOINCREMENT"}
          - {name: "name", type: "TEXT", constraints: "NOT NULL"}
          - {name: "department", type: "TEXT", constraints: "NOT NULL"}
          - {name: "title", type: "TEXT", constraints: "NOT NULL"}
          - {name: "email", type: "TEXT", constraints: "NOT NULL UNIQUE"}
          - {name: "hire_date", type: "TEXT", constraints: "NOT NULL"}
          - {name: "created_at", type: "TEXT", constraints: "DEFAULT datetime('now','localtime')"}
          - {name: "updated_at", type: "TEXT", constraints: "DEFAULT datetime('now','localtime')"}
  api:
    endpoints:
      - {method: "GET", path: "/", description: "員工列表與搜尋", query: "?q=關鍵字", response: "HTML"}
      - {method: "GET", path: "/add", description: "新增表單", response: "HTML"}
      - {method: "POST", path: "/add", description: "提交新增", request: "Form 5欄位", response: "302→/ 或 200錯誤"}
      - {method: "GET", path: "/edit/<id>", description: "編輯表單", response: "HTML"}
      - {method: "POST", path: "/edit/<id>", description: "提交修改", request: "Form 5欄位", response: "302→/ 或 200錯誤"}
      - {method: "POST", path: "/delete/<id>", description: "刪除員工", response: "302→/"}
  evaluator:
    passed: true
    scores:
      completeness: 100
      consistency: 100
      traceability: 100
    errors:
      type_a: []
      type_b: []

