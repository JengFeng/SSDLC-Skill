security_controls:
  data_encryption: ["AES-256 欄位級加密", "bcrypt 密碼雜湊", "TLS 1.2+ HTTPS"]
  access_control: ["RBAC 三層", "AD SSO LDAPS", "Session 30min 逾時"]
  audit: ["audit_log Append-Only", "employee_history Append-Only"]
  compliance: ["台灣個資法", "勞動基準法 5年保留", "資通系統防護基準普級"]
