# SSDLC 可執行規格 (SSOT) — Employee Management System
# 一源多用：此 YAML 為唯一資料源，自動生成 SRS、RTM、Phase Gates、Test Cases
# Phase 01-06 所有 AI 代理必須以此為執行依據

project:
  name: "Employee Management System"
  version: "1.1.0"
  created: "2026-06-28"
  methodology: "TDD + SSDLC + Security-Principles"
  security_baseline: "General (普級)"
  security_compliance: "資通系統防護基準驗證實務 v1.3"
  security_coverage: "90.5%"

tech_stack:
  backend: "Python 3.13 + Flask 3.x"
  database: "SQLite"
  frontend: "Jinja2 SSR + frontend-app-builder CSS"
  testing: "pytest 9.x (API) + Playwright 1.x (UI)"
  security: "SHA-256 + SALT, 參數化查詢, Security Headers, Session"

# ── 功能需求 (SSOT) ──
requirements:
  - id: "REQ-001"
    name: "員工列表與搜尋"
    priority: "P0"
    description: "顯示所有員工，支援關鍵字搜尋（姓名/部門/Email）"
    test_ids: ["TC-001", "TC-002", "TC-003"]

  - id: "REQ-002"
    name: "新增員工"
    priority: "P0"
    description: "表單輸入五項欄位，Email 唯一驗證"
    test_ids: ["TC-004", "TC-005"]
    security: ["input_validation", "sql_injection_prevention"]

  - id: "REQ-003"
    name: "修改員工"
    priority: "P0"
    description: "表單預載 → 編輯 → 更新"
    test_ids: ["TC-006"]

  - id: "REQ-004"
    name: "刪除員工"
    priority: "P0"
    description: "確認對話框後硬刪除"
    test_ids: ["TC-007"]
    security: ["csrf_prevention"]

  - id: "REQ-005"
    name: "登入驗證"
    priority: "P0"
    description: "Email + 密碼登入，Session 管理"
    test_ids: ["TC-UI-001", "TC-UI-002"]
    security: ["password_hashing", "account_lockout", "session_management"]

  - id: "REQ-006"
    name: "安全防護"
    priority: "P0"
    description: "Security Headers、輸入過濾、參數化查詢"
    test_ids: ["TC-UI-003"]
    security: ["xss_prevention", "security_headers", "sql_injection_prevention"]

# ── 資料模型 (SSOT) ──
data_model:
  employees:
    columns:
      - {name: id, type: INTEGER, constraints: "PK AUTOINCREMENT"}
      - {name: name, type: TEXT, constraints: "NOT NULL"}
      - {name: department, type: TEXT, constraints: "NOT NULL"}
      - {name: title, type: TEXT, constraints: "NOT NULL"}
      - {name: email, type: TEXT, constraints: "NOT NULL UNIQUE"}
      - {name: password_hash, type: TEXT, constraints: "NOT NULL DEFAULT ''"}
      - {name: hire_date, type: TEXT, constraints: "NOT NULL"}
      - {name: last_login, type: TEXT}
      - {name: login_attempts, type: INTEGER, constraints: "DEFAULT 0"}
      - {name: locked_until, type: TEXT}
      - {name: active, type: INTEGER, constraints: "DEFAULT 1"}
      - {name: created_at, type: TEXT, constraints: "DEFAULT now"}
      - {name: updated_at, type: TEXT, constraints: "DEFAULT now"}

# ── API 端點 (SSOT) ──
api_endpoints:
  - {method: GET, path: "/login", auth: false, description: "登入頁面"}
  - {method: POST, path: "/login", auth: false, description: "登入驗證"}
  - {method: GET, path: "/logout", auth: "Session", description: "登出"}
  - {method: GET, path: "/", auth: "Session", description: "員工列表"}
  - {method: GET, path: "/add", auth: "Session", description: "新增表單"}
  - {method: POST, path: "/add", auth: "Session", description: "新增員工"}
  - {method: GET, path: "/edit/<id>", auth: "Session", description: "編輯表單"}
  - {method: POST, path: "/edit/<id>", auth: "Session", description: "更新員工"}
  - {method: POST, path: "/delete/<id>", auth: "Session", description: "刪除員工"}

# ── 安全控制 (SSOT) ──
security_controls:
  authentication:
    mechanism: "Email + Password"
    hashing: "SHA-256 + SALT"
    session: "Flask Session (server-side)"
    lockout: "5 attempts / 15 minutes"

  headers:
    X_Content_Type_Options: "nosniff"
    X_Frame_Options: "DENY"
    X_XSS_Protection: "1; mode=block"

  input_validation:
    sql_injection: "100% parameterized queries"
    xss: "Jinja2 auto-escaping + validate_input()"
    email: "UNIQUE constraint + format validation"

  auditing:
    mechanism: "app.log"
    events: ["login", "logout", "create", "update", "delete"]

# ── Phase Gates (SSOT) ──
phases:
  "01_planning":
    status: completed
    inputs: ["user_requirement_raw.md"]
    outputs: ["formal_requirements.md", "requirement_tracker.md", "grill_me_session.md", "security_requirements.md"]
    score: 100

  "02_design":
    status: completed
    inputs: ["formal_requirements.md", "executable_spec.yaml"]
    outputs: ["db_schema.sql", "er_diagram.md", "api_spec.md", "ui_prototype.html", "use_case_diagram.md", "activity_diagram.md", "sequence_diagram.md", "threat_model.md"]
    score: 100

  "03_implementation":
    status: completed
    inputs: ["api_spec.md", "db_schema.sql", "ui_prototype.html", "executable_spec.yaml"]
    outputs: ["app.py", "templates/"]
    score: 100

  "04_testing":
    status: completed
    inputs: ["app.py", "executable_spec.yaml"]
    outputs: ["test_employee_crud.py", "test_results.md", "bug_tracker.md"]
    score: 100

  "05_deployment":
    status: completed
    inputs: ["app.py", "test_results.md", "executable_spec.yaml"]
    outputs: ["run.bat", "requirements.txt", "security_deployment_checklist.md", ".env.example"]
    score: 100

  "06_maintenance":
    status: completed
    inputs: ["app.py", "security_deployment_checklist.md", "executable_spec.yaml"]
    outputs: ["monitoring_guide.md", "security_trend.md"]
    score: 100

# ── 追溯矩陣 (SSOT) ──
traceability:
  total_requirements: 6
  fully_traced: 6
  test_coverage: "100% (16 tests / 6 REQs)"
  matrix_file: "requirement_tracker.md"

# ── 變更紀錄 ──
change_log:
  - version: "1.1.0"
    date: "2026-06-28"
    changes:
      - "SSOT 架構建立：executable_spec.yaml 為唯一資料源"
      - "雙軌規格：人可讀 SRS + AI 可執行 YAML"
      - "全流程 PDCA 重跑 (Phase 01-06)"
      - "TDD: 16/16 PASSED"
      - "STRIDE 威脅模型"
      - "資安防護基準導入 (General 90.5%)"
