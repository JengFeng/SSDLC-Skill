<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>員工管理</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:"Microsoft JhengHei",sans-serif;background:#f0f2f5;color:#333}.container{max-width:1100px;margin:40px auto;padding:0 20px}h1{color:#1a73e8;margin-bottom:24px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px}.search-form{display:flex;gap:8px}.search-form input{padding:8px 12px;border:1px solid #d0d5dd;border-radius:6px;width:240px}.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}.btn-primary{background:#1a73e8;color:#fff}.btn-success{background:#0d9488;color:#fff}.btn-danger{background:#dc2626;color:#fff}.btn-sm{padding:4px 10px;font-size:13px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.1)}th{background:#1a73e8;color:#fff;padding:12px 14px;text-align:left}td{padding:10px 14px;border-bottom:1px solid #e5e7eb}tr:hover{background:#f8fafc}.actions{display:flex;gap:6px}.flash{padding:12px 16px;border-radius:6px;margin-bottom:16px}.flash-success{background:#d1fae5;color:#065f46}.flash-error{background:#fee2e2;color:#991b1b}.empty{text-align:center;padding:40px;color:#9ca3af}.form-group{margin-bottom:16px}.form-group label{display:block;margin-bottom:4px;font-weight:500}.form-group input{width:100%;padding:10px 12px;border:1px solid #d0d5dd;border-radius:6px}.form-group input:focus{outline:none;border-color:#1a73e8;box-shadow:0 0 0 3px rgba(26,115,232,.1)}.form-card{background:#fff;padding:28px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);max-width:500px}.form-actions{display:flex;gap:10px;margin-top:20px}.btn-outline{background:#fff;color:#374151;border:1px solid #d0d5dd}.back-link{margin-bottom:20px;display:inline-block;color:#1a73e8}
</style></head><body><div class="container"><h1>員工基本資料管理系統</h1>
{% with m=get_flashed_messages(with_categories=true) %}{% if m %}{% for c,msg in m %}<div class="flash flash-{{c}}">{{msg}}</div>{% endfor %}{% endif %}{% endwith %}
{% block content %}{% endblock %}</div></body></html>
