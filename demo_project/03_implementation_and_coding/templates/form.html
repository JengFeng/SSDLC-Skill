{% extends "base.html" %}
{% block content %}

<a href="{{ url_for('index') }}" class="back-link">&#8592; 返回員工列表</a>

<div class="form-card">
    {% if action == "edit" %}
    <h2>&#9998; 編輯員工</h2>
    {% else %}
    <h2>&#10133; 新增員工</h2>
    {% endif %}
    
    <form method="post">
        <div class="form-row">
            <div class="form-group">
                <label>姓名 <span style="color:var(--danger)">*</span></label>
                <input type="text" name="name" value="{{ employee.get('name', '') }}" placeholder="請輸入姓名" required>
            </div>
            <div class="form-group">
                <label>部門 <span style="color:var(--danger)">*</span></label>
                <select name="department" required>
                    <option value="">請選擇部門</option>
                    {% set dept = employee.get('department', '') %}
                    <option value="IT" {% if dept == 'IT' %}selected{% endif %}>IT</option>
                    <option value="Engineering" {% if dept == 'Engineering' %}selected{% endif %}>Engineering</option>
                    <option value="HR" {% if dept == 'HR' %}selected{% endif %}>HR</option>
                    <option value="Sales" {% if dept == 'Sales' %}selected{% endif %}>Sales</option>
                    <option value="Marketing" {% if dept == 'Marketing' %}selected{% endif %}>Marketing</option>
                    <option value="Finance" {% if dept == 'Finance' %}selected{% endif %}>Finance</option>
                </select>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>職稱 <span style="color:var(--danger)">*</span></label>
                <input type="text" name="title" value="{{ employee.get('title', '') }}" placeholder="請輸入職稱" required>
            </div>
            <div class="form-group">
                <label>電子郵件 <span style="color:var(--danger)">*</span></label>
                <input type="email" name="email" value="{{ employee.get('email', '') }}" placeholder="user@company.com" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>到職日期 <span style="color:var(--danger)">*</span></label>
                <input type="date" name="hire_date" value="{{ employee.get('hire_date', '') }}" required>
            </div>
        </div>
        
        <div class="form-actions">
            {% if action == "edit" %}
            <button type="submit" class="btn-submit">&#128190; 更新資料</button>
            {% else %}
            <button type="submit" class="btn-submit">&#128190; 新增員工</button>
            {% endif %}
            <a href="{{ url_for('index') }}" class="btn-cancel">取消</a>
        </div>
    </form>
</div>

{% endblock %}
