<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入 — 員工基本資料管理系統</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a5f 0%,#2c5f8a 100%)}
.login-card{width:100%;max-width:440px;border:none;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.login-card .card-body{padding:2.5rem}
</style>
</head>
<body>
<div class="login-page">
<div class="login-card card">
<div class="card-body text-center">
<i class="bi bi-people-fill text-primary" style="font-size:3rem"></i>
<h4 class="mt-3 mb-1">員工基本資料管理系統</h4>
<p class="text-muted small mb-4">請使用公司帳號登入</p>

<a href="{{ url_for('login_ad') }}" class="btn btn-primary w-100 mb-3 py-2"><i class="bi bi-microsoft me-2"></i>Windows AD 單一登入</a>
<div class="text-muted small mb-3">— 或使用備援帳號登入 —</div>

<form method="POST" action="{{ url_for('login_local') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3 text-start"><label class="form-label small">公司 Email</label><input type="email" name="email" class="form-control form-control-sm" required></div>
<div class="mb-3 text-start"><label class="form-label small">密碼</label><input type="password" name="password" class="form-control form-control-sm" required></div>
<button type="submit" class="btn btn-outline-primary w-100 py-2"><i class="bi bi-box-arrow-in-right me-2"></i>備援帳號登入</button>
</form>

<p class="text-muted small mt-3 mb-0"><i class="bi bi-shield-lock"></i> 傳輸加密保護 · 符合個資法規範</p>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
