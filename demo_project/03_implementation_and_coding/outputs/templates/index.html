{% extends "base.html" %}{% block content %}
<div class="toolbar"><form class="search-form" method="get"><input type="text" name="q" value="{{query}}" placeholder="搜尋姓名、部門或 Email..."><button type="submit" class="btn btn-primary">搜尋</button>{% if query %}<a href="{{url_for('index')}}" class="btn btn-outline btn-sm">清除</a>{% endif %}</form><a href="{{url_for('add')}}" class="btn btn-success">+ 新增員工</a></div>
{% if employees %}<table><thead><tr><th>編號</th><th>姓名</th><th>部門</th><th>職稱</th><th>Email</th><th>到職日</th><th>操作</th></tr></thead><tbody>
{% for e in employees %}<tr><td>{{e.id}}</td><td>{{e.name}}</td><td>{{e.department}}</td><td>{{e.title}}</td><td>{{e.email}}</td><td>{{e.hire_date}}</td><td class="actions"><a href="{{url_for('edit',eid=e.id)}}" class="btn btn-primary btn-sm">編輯</a><form method="post" action="{{url_for('delete',eid=e.id)}}" style="display:inline" onsubmit="return confirm('確定要刪除 {{e.name}} 嗎？')"><button class="btn btn-danger btn-sm">刪除</button></form></td></tr>{% endfor %}</tbody></table>
{% else %}<div class="empty">尚無員工資料，請點選「新增員工」開始建立。</div>{% endif %}{% endblock %}
