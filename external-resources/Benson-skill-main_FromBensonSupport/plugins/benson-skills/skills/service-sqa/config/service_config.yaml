  - page: control_commands.php
    perm: control_commands.view
    category: 控制管理
  - page: control_logs.php
    perm: control_logs.view
    category: 控制管理
  - page: modbus_control_test.php
    perm: modbus_control_test.view
    category: 控制管理
  - page: backup_management.php
    perm: backup.view
    category: 系統管理
  - page: ftp_browser.php
    perm: ftp_browser.view
    category: 系統管理
  - page: mqtt_brokers.php
    perm: mqtt_brokers.view
    category: 系統管理
  - page: email_config.php
    perm: email_config.view
    category: 系統管理
  - page: system_schedule.php
    perm: system_schedule.view
    category: 系統管理
  - page: service_monitor.php
    perm: service_monitor.view
    category: 系統管理
  - page: system_config.php
    perm: system_config.view
    category: 系統管理
  - page: system_maintenance.php
    perm: system_maintenance.view
    category: 系統管理
  - page: users_management.php
    perm: users.view
    category: 使用者管理
  - page: roles_management.php
    perm: roles.view
    category: 使用者管理
  - page: login_security.php
    perm: login_security.view
    category: 使用者管理
  - page: stations.php
    perm: stations.view
    category: 監測站與感測器
  - page: sensors.php
    perm: sensors.view
    category: 監測站與感測器
  - page: sensor_types.php
    perm: sensor_types.view
    category: 監測站與感測器
  - page: motor_dependency.php
    perm: motor_dependency.view
    category: 監測站與感測器
  - page: history.php
    perm: history.view
    category: 歷史數據
  - page: availability.php
    perm: availability.view
    category: 歷史數據
  - page: alert_logs.php
    perm: alert_logs.view
    category: 歷史數據
  - page: inspection_logs.php
    perm: inspection_logs.view
    category: 歷史數據
  - page: outflow_api.php
    perm: outflow_api.view
