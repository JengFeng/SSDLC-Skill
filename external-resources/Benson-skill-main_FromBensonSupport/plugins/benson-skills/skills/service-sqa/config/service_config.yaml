# Benson 水利監控系統 — SQA 檢測 config
# 2026-04-18 初版，對應 C:\github\service 專案

site:
  base_url: https://your-server.example.com/service
  local_path: C:\github\service
  deploy_path: Z:\service

roles:
  admin:
    username: benson
    display: 系統管理員
    expected_permission_count: 56
    can_impersonate: true   # benson 可在 topbar 切其他角色（免登出）
  operator:
    username: test_operator     # 或 qa_operator
    display: 操作員
    expected_permission_count: 22
  viewer:
    username: test_viewer
    display: 檢視者
    expected_permission_count: 10
    whitelist:  # viewer 應該只能看到的 permission key（viewer_allowed_views()）
      - dashboard.view
      - stations.view
      - sensors.view
      - sensor_types.view
      - motor_dependency.view
      - history.view
      - availability.view
      - alert_logs.view
      - inspection_logs.view
      - app.data.view

# 管理頁（有 require_permission 的頁面）
admin_pages:
