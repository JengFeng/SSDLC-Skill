# =============================================================================
# 可執行規格母版 (Executable Specification - SSOT)
# =============================================================================
# 本檔案為專案唯一資料源（Single Source of Truth）。
# 所有 6 個 SSDLC 階段的 AI 代理（Planner/Generator/Evaluator）皆以此檔案
# 作為主要讀取/寫入對象。system_specification.md 由此檔案自動生成。
#
# 更新規則：
#   - Planner：讀取現有狀態，規劃本階段目標
#   - Generator：讀取 inputs，寫入 outputs
#   - Evaluator：驗證 outputs，寫入 verification 狀態
#   - 階段完成後自動遞增 version 並記錄變更至 change_log
# =============================================================================

project:
  name: "<專案初始化後自動填入>"
  version: "0.1.0"
  created: "<專案初始化後自動填入>"
  last_updated: "<專案初始化後自動填入>"
  current_phase: "01_planning_and_analysis"
  description: "<專案初始化後自動填入>"

# =============================================================================
# 階段 01：規劃與需求分析
# =============================================================================
phase_01_planning:
  status: pending            # pending | in_progress | completed
  baseline: null             # baseline/phase-01_v{N}/ (Evaluator 通過後填入)
  inputs:
    raw_requirements: []     # 原始口語需求來源路徑
    rfp_documents: []        # RFP 文件路徑
  outputs:
    formal_requirements: null    # outputs/formal_requirements.md
    requirement_tracker: null    # reg/requirement_tracker.md
  requirements:              # 正規化後的需求清單（由 Generator 寫入）
    - id: "<專案初始化後自動填入>"
      description: "<專案初始化後自動填入>"
      priority: P0           # P0 | P1 | P2
      source: "<專案初始化後自動填入>"
      acceptance_criteria: []
  evaluator:
    passed: false
    scores:
      coverage: 0            # 需求覆蓋率 (40%)
      clarity: 0             # 需求明確性 (30%)
      traceability: 0        # 追溯鏈完整性 (20%)
      format: 0              # 格式一致性 (10%)
    errors:
      type_a: []             # A 類執行層錯誤
      type_b: []             # B 類規劃層錯誤

