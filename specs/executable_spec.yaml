    sequence_diagram: null   # sequence_diagram.md
  database:
    tables: []               # 資料表定義（由 Generator 從 db_schema.sql 萃取寫入）
  api:
    endpoints: []            # API 端點清單（由 Generator 從 api_spec.md 萃取寫入）
  evaluator:
    passed: false
    scores:
      completeness: 0
      consistency: 0
      traceability: 0
    errors:
      type_a: []
      type_b: []

