<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 104 1280 1000" role="img" aria-labelledby="16-state-session-title 16-state-session-desc" style="display:block;width:100%;min-width:0;height:auto" data-default-font-percent="100" width="1280" height="1000"><title id="16-state-session-title">瀏覽器的授權與 Session 狀態</title><desc id="16-state-session-desc">外部帳密授權只核發金鑰；LoginAPP 才建立網站登入 Session。取消授權、Logout 與 Session 不存在有不同結果。</desc><defs><style>
.node{fill:#fff;stroke:#98b4b5;stroke-width:1.2}.focal{fill:#e8f6f6;stroke:#089bab;stroke-width:1.5}
.name{font-family:'Geist','Microsoft JhengHei',sans-serif;font-size:16px;font-weight:700;fill:#182f34}
.sub,.member,.tag,.label,.source{font-family:'Geist Mono','Microsoft JhengHei',monospace;fill:#40595d}
.sub,.member{font-size:13px}.tag{font-size:12px;font-weight:700}.label{font-size:10.5px;font-weight:700}.source{font-size:11px;font-weight:700}.group{font-family:'Geist','Microsoft JhengHei',sans-serif;font-size:17px;font-weight:700;fill:#182f34}
.edge{fill:none;stroke:#60777a;stroke-width:1.2}.sep{stroke:#d5e2df;stroke-width:1}.zone{fill:#f0f6f4;stroke:#d5e2df;stroke-width:1}

.name{font-size:22px;font-weight:700;fill:#183b43}
.sub{font-size:18px;font-weight:500;fill:#304e54}
.member,.label{font-size:16px;font-weight:600;fill:#304e54}
.tag,.source{font-size:14px;font-weight:600;fill:#304e54}
.group{font-size:22px;font-weight:700;fill:#183b43}
.node{stroke:#6f9699;stroke-width:1.8}.focal{stroke:#087e8c;stroke-width:2.2}
.edge{stroke:#3f6269;stroke-width:1.8}.sep{stroke:#b4cdca;stroke-width:1.2}
</style>
<marker id="16-state-session-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#60777a" /></marker>
<marker id="16-state-session-open" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#60777a" /></marker>
<marker id="16-state-session-triangle" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#f7faf9" stroke="#60777a" /></marker></defs><path class="edge" d="M 304,231.2 L 480,231.2" marker-end="url(#16-state-session-arrow)"><title>AUTH CODE | E04</title></path><g data-label="true"><rect x="335.92" y="203.2" width="112.16" height="22" fill="#f7faf9" rx="2" /><text x="392" y="220.2" class="label" text-anchor="middle"><tspan x="392" y="220.2">AUTH CODE</tspan></text></g><path class="edge" d="M 720,231.2 L 896,231.2" marker-end="url(#16-state-session-arrow)"><title>PASSWORD OK | E05</title></path><g data-label="true"><rect x="741.68" y="203.2" width="132.64" height="22" fill="#f7faf9" rx="2" /><text x="808" y="220.2" class="label" text-anchor="middle"><tspan x="808" y="220.2">PASSWORD OK</tspan></text></g><path class="edge" d="M 1016,326.4 L 1016,680" marker-end="url(#16-state-session-arrow)"><title>LoginAPP [VALID] | E06, E13</title></path><g data-label="true"><rect x="1020.08" y="517.7" width="183.84" height="22" fill="#f7faf9" rx="2" /><text x="1112" y="534.7" class="label" text-anchor="middle"><tspan x="1112" y="534.7">LoginAPP [VALID]</tspan></text></g><path class="edge" d="M 600,326.4 L 600,680" marker-end="url(#16-state-session-arrow)"><title>CANCEL | E05</title></path><g data-label="true"><rect x="647.28" y="517.7" width="81.44" height="22" fill="#f7faf9" rx="2" /><text x="688" y="534.7" class="label" text-anchor="middle"><tspan x="688" y="534.7">CANCEL</tspan></text></g><path class="edge" d="M 1016,870.4 L 1016,1006.4 Q 1016,1020,1008,1020 L 192,1020 Q 184,1020,184,1006.4 L 184,326.4" marker-end="url(#16-state-session-arrow)"><title>LOGOUT / SESSION ABSENT | E27, E14, E03</title></path><g data-label="true"><rect x="472.24" y="992" width="255.52" height="22" fill="#f7faf9" rx="2" /><text x="600" y="1009" class="label" text-anchor="middle"><tspan x="600" y="1009">LOGOUT / SESSION ABSENT</tspan></text></g><g data-node="out"><rect x="64" y="136" width="240" height="190.4" rx="6" class="node" /><title>尚未登入網站 | E14</title><text x="184" y="212.7" class="name" text-anchor="middle"><tspan x="184" y="212.7">尚未登入網站</tspan></text><text x="184" y="242.9" class="sub" text-anchor="middle"><tspan x="184" y="242.9">UserName 不存在</tspan></text><text x="294" y="314.4" class="source" text-anchor="end"><tspan x="294" y="314.4">來源：E14</tspan></text></g><g data-node="form"><rect x="480" y="136" width="240" height="190.4" rx="6" class="node" /><title>外部授權頁 | E04, E19</title><text x="600" y="212.7" class="name" text-anchor="middle"><tspan x="600" y="212.7">外部授權頁</tspan></text><text x="600" y="242.9" class="sub" text-anchor="middle"><tspan x="600" y="242.9">等待帳密／驗證碼</tspan></text><text x="710" y="314.4" class="source" text-anchor="end"><tspan x="710" y="314.4">來源：E04、E19</tspan></text></g><g data-node="token"><rect x="896" y="136" width="240" height="190.4" rx="6" class="node" /><title>APP 已取得金鑰 | E05, E07</title><text x="1016" y="212.7" class="name" text-anchor="middle"><tspan x="1016" y="212.7">APP 已取得金鑰</tspan></text><text x="1016" y="242.9" class="sub" text-anchor="middle"><tspan x="1016" y="242.9">尚未建立登入 Session</tspan></text><text x="1126" y="314.4" class="source" text-anchor="end"><tspan x="1126" y="314.4">來源：E05、E07</tspan></text></g><g data-node="login"><rect x="896" y="680" width="240" height="190.4" rx="6" class="focal" /><title>網站 Session 已登入 | E06, E13</title><text x="1016" y="739.1" class="name" text-anchor="middle"><tspan x="1016" y="739.1">網站 Session</tspan><tspan x="1016" y="774.3">已登入</tspan></text><text x="1016" y="804.5" class="sub" text-anchor="middle"><tspan x="1016" y="804.5">UserName / 水號清單</tspan></text><text x="1126" y="858.4" class="source" text-anchor="end"><tspan x="1126" y="858.4">來源：E06、E13</tspan></text></g><g data-node="cancel"><rect x="480" y="680" width="240" height="190.4" rx="6" class="node" /><title>已取消此次授權 | E05</title><text x="600" y="742.3" class="name" text-anchor="middle"><tspan x="600" y="742.3">已取消此次授權</tspan></text><text x="600" y="772.5" class="sub" text-anchor="middle"><tspan x="600" y="772.5">1003 或 refresh 的</tspan><tspan x="600" y="801.3">1005</tspan></text><text x="710" y="858.4" class="source" text-anchor="end"><tspan x="710" y="858.4">來源：E05</tspan></text></g><line class="sep" x1="32" y1="1048" x2="1248" y2="1048" /><text x="32" y="1080" class="source" text-anchor="start">來源 E##：E = Evidence（證據），數字是索引，非步驟／錯誤碼；完整檔名與行號見下方「來源編號索引」。</text></svg>