<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 64 1280 1316" role="img" aria-labelledby="05-flowchart-refresh-title 05-flowchart-refresh-desc" style="display:block;width:100%;min-width:0;height:auto" data-default-font-percent="100" width="1280" height="1316"><title id="05-flowchart-refresh-title">Refresh Token：直接換發或重新驗證</title><desc id="05-flowchart-refresh-desc">有效帳號且 grant_type=refresh_token 後，檢查 refresh_token；資料庫命中則直接覆寫新金鑰，未命中則顯示授權頁。</desc><defs><style>
.node{fill:#fff;stroke:#98b4b5;stroke-width:1.2}.focal{fill:#e8f6f6;stroke:#089bab;stroke-width:1.5}
.name{font-family:'Geist','Microsoft JhengHei',sans-serif;font-size:16px;font-weight:700;fill:#182f34}
.sub,.member,.tag,.label,.source{font-family:'Geist Mono','Microsoft JhengHei',monospace;fill:#40595d}
.sub,.member{font-size:13px}.tag{font-size:12px;font-weight:700}.label{font-size:10.5px;font-weight:700}.source{font-size:11px;font-weight:700}.group{font-family:'Geist','Microsoft JhengHei',sans-serif;font-size:17px;font-weight:700;fill:#182f34}
.edge{fill:none;stroke:#60777a;stroke-width:1.2}.sep{stroke:#d5e2df;stroke-width:1}.zone{fill:#f0f6f4;stroke:#d5e2df;stroke-width:1}

.name{font-size:22px;font-weight:700;fill:#183b43}
.sub{font-size:18px;font-weight:500;fill:#304e54}
.member,.label{font-size:16px;font-weight:600;fill:#304e54}
.tag,.source{font-size:14px;font-weight:600;fill:#304e54}
.group{font-size:22px;font-weight:700;fill:#183b43}
.node{stroke:#6f9699;stroke-width:1.8}.focal{stroke:#087e8c;stroke-width:2.2}
.edge{stroke:#3f6269;stroke-width:1.8}.sep{stroke:#b4cdca;stroke-width:1.2}
</style>
