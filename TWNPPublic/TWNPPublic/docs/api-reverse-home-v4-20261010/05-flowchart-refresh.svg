 x="630" y="212">來源：E04</tspan></text></g><g data-node="nonempty"><polygon points="520,336 640,416 520,496 400,416" class="node" /><title>refresh_token 非空？ | E04</title><text x="520" y="408.3" class="name" text-anchor="middle"><tspan x="520" y="408.3">refresh_tok</tspan><tspan x="520" y="443.5">en 非空？</tspan></text></g><g data-node="match"><polygon points="520,624 640,704 520,784 400,704" class="node" /><title>DB refresh 命中？ | E04, E09</title><text x="520" y="696.3" class="name" text-anchor="middle"><tspan x="520" y="696.3">DB refresh</tspan><tspan x="520" y="731.5">命中？</tspan></text></g><g data-node="issue"><rect x="400" y="928" width="240" height="160" rx="6" class="focal" /><title>IssueAppToken | E07, E11</title><text x="520" y="989.5" class="name" text-anchor="middle"><tspan x="520" y="989.5">IssueAppToken</tspan></text><text x="520" y="1019.7" class="sub" text-anchor="middle"><tspan x="520" y="1019.7">覆寫 PWD 與 refresh</tspan></text><text x="630" y="1076" class="source" text-anchor="end"><tspan x="630" y="1076">來源：E07、E11</tspan></text></g><g data-node="ok"><rect x="400" y="1168" width="240" height="128" rx="20" class="node" /><title>回應 result=200 | E04, E08</title><text x="520" y="1213.5" class="name" text-anchor="middle"><tspan x="520" y="1213.5">回應 result=200</tspan></text><text x="520" y="1243.7" class="sub" text-anchor="middle"><tspan x="520" y="1243.7">換發金鑰成功</tspan></text><text x="630" y="1284" class="source" text-anchor="end"><tspan x="630" y="1284">來源：E04、E08</tspan></text></g><g data-node="bad"><rect x="856" y="336" width="240" height="160" rx="6" class="node" /><title>回應 result=1001 | E04, E08</title><text x="976" y="397.5" class="name" text-anchor="middle"><tspan x="976" y="397.5">回應 result=1001</tspan></text><text x="976" y="427.7" class="sub" text-anchor="middle"><tspan x="976" y="427.7">refresh_token 空白</tspan></text><text x="1086" y="484" class="source" text-anchor="end"><tspan x="1086" y="484">來源：E04、E08</tspan></text></g><g data-node="relogin"><rect x="856" y="624" width="240" height="160" rx="6" class="node" /><title>顯示 ExternalLogin | E04, E19</title><text x="976" y="661.5" class="name" text-anchor="middle"><tspan x="976" y="661.5">顯示 ExternalLog</tspan><tspan x="976" y="696.7">in</tspan></text><text x="976" y="726.9" class="sub" text-anchor="middle"><tspan x="976" y="726.9">GrantType=refresh_</tspan><tspan x="976" y="755.7">token</tspan></text></g><line class="sep" x1="32" y1="1324" x2="1248" y2="1324" /><text x="32" y="1356" class="source" text-anchor="start">來源 E##：E = Evidence（證據），數字是索引，非步驟／錯誤碼；完整檔名與行號見下方「來源編號索引」。</text></svg>