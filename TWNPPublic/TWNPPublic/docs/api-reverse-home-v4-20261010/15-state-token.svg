<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 956" role="img" aria-labelledby="15-state-token-title 15-state-token-desc" style="display:block;width:100%;min-width:0;height:auto" data-default-font-percent="100" width="1280" height="956"><title id="15-state-token-title">Token 的可用狀態（由條件推導）</title><desc id="15-state-token-desc">以 LoginAPP 是否接受一組 Token 為狀態，呈現六個月期限、覆寫與帳號失效的效果。</desc><defs><style>
.node{fill:#fff;stroke:#98b4b5;stroke-width:1.2}.focal{fill:#e8f6f6;stroke:#089bab;stroke-width:1.5}
.name{font-family:'Geist','Microsoft JhengHei',sans-serif;font-size:16px;font-weight:700;fill:#182f34}
.sub,.member,.tag,.label,.source{font-family:'Geist Mono','Microsoft JhengHei',monospace;fill:#40595d}
.sub,.member{font-size:13px}.tag{font-size:12px;font-weight:700}.label{font-size:10.5px;font-weight:700}.source{font-size:11px;font-weight:700}.group{font-family:'Geist','Microsoft JhengHei',sans-serif;font-size:17px;font-weight:700;fill:#182f34}
.edge{fill:none;stroke:#60777a;stroke-width:1.2}.sep{stroke:#d5e2df;stroke-width:1}.zone{fill:#f0f6f4;stroke:#d5e2df;stroke-width:1}

.name{font-size:22px;font-weight:700;fill:#183b43}
.sub{font-size:18px;font-weight:500;fill:#304e54}
.member,.label{font-size:16px;font-weight:600;fill:#304e54}
.tag,.source{font-size:14px;font-weight:600;fill:#304e54}
.group{font-size:22px;font-weight:700;fill:#183b43}
.node{stroke:#6f9699;stroke-width:1.8}.focal{stroke:#087e8c;stroke-width:2.2}
.edge{stroke:#3f6269;stroke-width:1.8}.sep{stroke:#b4cdca;stroke-width:1.2}
</style>
<marker id="15-state-token-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#60777a" /></marker>
<marker id="15-state-token-open" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#60777a" /></marker>
<marker id="15-state-token-triangle" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#f7faf9" stroke="#60777a" /></marker></defs><path class="edge" d="M 304,231.2 L 480,231.2" marker-end="url(#15-state-token-arrow)"><title>AUTHORIZE | E05, E07</title></path><g data-label="true"><rect x="335.92" y="203.2" width="112.16" height="22" fill="#f7faf9" rx="2" /><text x="392" y="220.2" class="label" text-anchor="middle"><tspan x="392" y="220.2">AUTHORIZE</tspan></text></g><path class="edge" d="M 720,231.2 L 896,231.2" marker-end="url(#15-state-token-arrow)"><title>TIME &gt; 6 MONTH | E07</title></path><g data-label="true"><rect x="726.32" y="203.2" width="163.36" height="22" fill="#f7faf9" rx="2" /><text x="808" y="220.2" class="label" text-anchor="middle"><tspan x="808" y="220.2">TIME &gt; 6 MONTH</tspan></text></g><path class="edge" d="M 536,326.4 L 536,530.4 Q 536,544,528,544 L 192,544 Q 184,544,184,557.6 L 184,680" marker-end="url(#15-state-token-arrow)"><title>NEW ISSUE | E07, E11</title></path><g data-label="true"><rect x="303.92" y="516" width="112.16" height="22" fill="#f7faf9" rx="2" /><text x="360" y="533" class="label" text-anchor="middle"><tspan x="360" y="533">NEW ISSUE</tspan></text></g><path class="edge" d="M 664,326.4 L 664,584.8 Q 664,598.4,672,598.4 L 1008,598.4 Q 1016,598.4,1016,612 L 1016,680" marker-end="url(#15-state-token-arrow)"><title>VALID ≠ 1 | E09</title></path><g data-label="true"><rect x="783.92" y="570.4" width="112.16" height="22" fill="#f7faf9" rx="2" /><text x="840" y="587.4" class="label" text-anchor="middle"><tspan x="840" y="587.4">VALID ≠ 1</tspan></text></g><path class="edge" d="M 1016,136 L 1016,81.6 Q 1016,68,1008,68 L 608,68 Q 600,68,600,81.6 L 600,136" stroke-dasharray="5 4" marker-end="url(#15-state-token-arrow)"><title>REFRESH MATCH / NEW TOKENS | E04, E09, E11</title></path><g data-label="true"><rect x="664.88" y="40" width="286.24" height="22" fill="#f7faf9" rx="2" /><text x="808" y="57" class="label" text-anchor="middle"><tspan x="808" y="57">REFRESH MATCH / NEW TOKENS</tspan></text></g><path class="edge" d="M 64,775.2 L 40,775.2 Q 32,775.2,32,761.6 L 32,435.2 Q 32,421.6,40,421.6 L 440,421.6 Q 448,421.6,448,408 L 448,285.6 Q 448,272,456,272 L 480,272" stroke-dasharray="5 4" marker-end="url(#15-state-token-arrow)"><title>REAUTHORIZE / NEW TOKENS | E04, E05, E07</title></path><g data-label="true"><rect x="123.12" y="393.6" width="265.76" height="22" fill="#f7faf9" rx="2" /><text x="256" y="410.6" class="label" text-anchor="middle"><tspan x="256" y="410.6">REAUTHORIZE / NEW TOKENS</tspan></text></g><g data-node="absent"><rect x="64" y="136" width="240" height="190.4" rx="6" class="node" /><title>沒有可用 V4 金鑰 | E05, E07</title><text x="184" y="212.7" class="name" text-anchor="middle"><tspan x="184" y="212.7">沒有可用 V4 金鑰</tspan></text><text x="184" y="242.9" class="sub" text-anchor="middle"><tspan x="184" y="242.9">需帳密授權</tspan></text><text x="294" y="314.4" class="source" text-anchor="end"><tspan x="294" y="314.4">來源：E05、E07</tspan></text></g><g data-node="valid"><rect x="480" y="136" width="240" height="190.4" rx="6" class="focal" /><title>可通過 Token 驗證 | E07, E09</title><text x="600" y="183.9" class="name" text-anchor="middle"><tspan x="600" y="183.9">可通過 Token 驗證</tspan></text><text x="600" y="214.1" class="sub" text-anchor="middle"><tspan x="600" y="214.1">DB 匹配 + VALID=1</tspan></text><text x="600" y="242.9" class="sub" text-anchor="middle"><tspan x="600" y="242.9">Now ≤ issuedAt+6</tspan><tspan x="600" y="271.7">months</tspan></text><text x="710" y="314.4" class="source" text-anchor="end"><tspan x="710" y="314.4">來源：E07、E09</tspan></text></g><g data-node="expired"><rect x="896" y="136" width="240" height="190.4" rx="6" class="node" /><title>Access 超過期限 | E06, E07</title><text x="1016" y="198.3" class="name" text-anchor="middle"><tspan x="1016" y="198.3">Access 超過期限</tspan></text><text x="1016" y="228.5" class="sub" text-anchor="middle"><tspan x="1016" y="228.5">LoginAPP → 1004</tspan><tspan x="1016" y="257.3">HTML</tspan></text><text x="1126" y="314.4" class="source" text-anchor="end"><tspan x="1126" y="314.4">來源：E06、E07</tspan></text></g><g data-node="replaced"><rect x="64" y="680" width="240" height="190.4" rx="6" class="node" /><title>舊憑證已被覆寫 | E09, E11</title><text x="184" y="742.3" class="name" text-anchor="middle"><tspan x="184" y="742.3">舊憑證已被覆寫</tspan></text><text x="184" y="772.5" class="sub" text-anchor="middle"><tspan x="184" y="772.5">舊 access /</tspan><tspan x="184" y="801.3">refresh 不匹配</tspan></text><text x="294" y="858.4" class="source" text-anchor="end"><tspan x="294" y="858.4">來源：E09、E11</tspan></text></g><g data-node="disabled"><rect x="896" y="680" width="240" height="190.4" rx="6" class="node" /><title>帳號 VALID ≠ 1 | E09, E10</title><text x="1016" y="756.7" class="name" text-anchor="middle"><tspan x="1016" y="756.7">帳號 VALID ≠ 1</tspan></text><text x="1016" y="786.9" class="sub" text-anchor="middle"><tspan x="1016" y="786.9">查詢無命中</tspan></text><text x="1126" y="858.4" class="source" text-anchor="end"><tspan x="1126" y="858.4">來源：E09、E10</tspan></text></g><line class="sep" x1="32" y1="900" x2="1248" y2="900" /><text x="32" y="932" class="source" text-anchor="start">來源 E##：E = Evidence（證據），數字是索引，非步驟／錯誤碼；完整檔名與行號見下方「來源編號索引」。</text></svg>