le></path><g data-label="true"><rect x="596.64" y="440" width="82.72" height="22" fill="#f7faf9" rx="2" /><text x="638" y="457" class="label" text-anchor="middle"><tspan x="638" y="457">05 帳號</tspan></text></g><path class="edge" d="M 468,534 H 128" stroke-dasharray="5 4" marker-end="url(#12-sequence-authorization-arrow)"><title>E04, E19</title></path><g data-label="true"><rect x="160" y="506" width="276" height="22" fill="#f7faf9" rx="2" /><text x="298" y="523" class="label" text-anchor="middle"><tspan x="298" y="523">06 200 HTML ExternalLogin</tspan></text></g><path class="edge" d="M 128,600 H 468" marker-end="url(#12-sequence-authorization-arrow)"><title>E05, E19</title></path><g data-label="true"><rect x="93.44" y="572" width="409.12" height="22" fill="#f7faf9" rx="2" /><text x="298" y="589" class="label" text-anchor="middle"><tspan x="298" y="589">07 POST ExternalLogin + CSRF + Captcha</tspan></text></g><path class="edge" d="M 468,666 H 808" marker-end="url(#12-sequence-authorization-arrow)"><title>E12, E20</title></path><g data-label="true"><rect x="469.28" y="638" width="337.44" height="22" fill="#f7faf9" rx="2" /><text x="638" y="655" class="label" text-anchor="middle"><tspan x="638" y="655">08 ValidateAppV4Password → APWD</tspan></text></g><path class="edge" d="M 808,732 H 468" stroke-dasharray="5 4" marker-end="url(#12-sequence-authorization-arrow)"><title>E12</title></path><g data-label="true"><rect x="486.56" y="704" width="302.88" height="22" fill="#f7faf9" rx="2" /><text x="638" y="721" class="label" text-anchor="middle"><tspan x="638" y="721">09 true（含 WCF 查詢與密碼比較）</tspan></text></g><path class="edge" d="M 468,798 H 808" marker-end="url(#12-sequence-authorization-arrow)"><title>E07, E11</title></path><g data-label="true"><rect x="433.44" y="770" width="409.12" height="22" fill="#f7faf9" rx="2" /><text x="638" y="787" class="label" text-anchor="middle"><tspan x="638" y="787">10 IssueAppToken → SaveAppV4TokenToPwd</tspan></text></g><path class="edge" d="