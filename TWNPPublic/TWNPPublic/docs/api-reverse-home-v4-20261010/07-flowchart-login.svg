<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 16 1280 1332" role="img" aria-labelledby="07-flowchart-login-title 07-flowchart-login-desc" style="display:block;width:100%;min-width:0;height:auto" data-default-font-percent="100" width="1280" height="1332"><title id="07-flowchart-login-title">LoginAPP：Token 到網站登入</title><desc id="07-flowchart-login-desc">檢查請求與 Token，再取得帳號和有效綁定水號，成功建立 Session 並轉往 Dashboard。</desc><defs><style>
