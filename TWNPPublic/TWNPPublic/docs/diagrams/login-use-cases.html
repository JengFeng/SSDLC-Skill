</style></head><body><main><p class="eyebrow">AUTHENTICATION · UML USE CASE</p><h1>登入與 APP 授權使用者案例</h1><p class="intro">把一般網站帳密登入與行動 APP Token 流程放在同一個系統邊界內。參與者依目前公開 Controller 入口推導；需求文件未定義的正式角色仍屬候選。</p>

<p class="foot">外部授權登入是使用者以帳密完成授權後，由網站回傳 Token 給 APP；APP Token 登入則是另一個 API，將 Access Token 換成網站 Session。請參閱 <a href="login-diagram-evidence.md">圖面證據表</a>。</p></main></body></html>
